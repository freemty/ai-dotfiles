# --- 基础设置 ---
# 启用鼠标支持（滚动、点击切换面板、拖拽调整面板大小）
set -g mouse on

# 256色支持
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# 减少 escape 延迟（对 vim 用户很重要）
set -sg escape-time 10

# 历史记录行数
set -g history-limit 10000

# 窗口编号从 1 开始（0 离得太远）
set -g base-index 1
setw -g pane-base-index 1

# 窗口关闭后自动重新编号
set -g renumber-windows on

# --- 快捷键 ---
# 用 | 和 - 分屏（更直观）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 新建窗口时保留当前路径
bind c new-window -c "#{pane_current_path}"

# 用 hjkl 切换面板（vim 风格）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 用 HJKL 调整面板大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# r 重新加载配置
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- 状态栏 ---
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left " #S "
set -g status-left-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g status-right " %H:%M %m-%d "
set -g status-right-style "bg=#a6e3a1,fg=#1e1e2e"

# 窗口标签样式
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=#f38ba8,fg=#1e1e2e,bold"

# 面板边框
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
